[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "thetascout"
version = "0.2.0"
description = "Covered call screener: option-chain analytics, Black-Scholes pricing and opportunity scoring."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tomas Pessagno" }]
dependencies = [
    "pandas>=2.2",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.40",
    "altair>=5",
    "streamlit-searchbox>=0.1.20",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "httpx",
]

[tool.setuptools.packages.find]
include = ["thetascout*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["streamlit_app.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["thetascout", "api"]
strict = true

[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true
